name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v1.0.0)
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $version = "${{ inputs.version }}" }
          elseif ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}" }
          else { $version = "v1.0.0" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests colorama
      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name "Multichain-Tracker" main
      - name: Package release
        shell: pwsh
        run: |
          @"
          Before using the tracker, configure your own API keys and wallet address in the source/configuration as described by the project.
          Never commit private API keys or secrets to the repository.
          "@ | Set-Content "CONFIGURATION_REQUIRED.txt"
          $zip = "Multichain-Tracker-$env:VERSION-Windows-x64.zip"
          Compress-Archive -Path "dist/Multichain-Tracker.exe", "README.md", "CONFIGURATION_REQUIRED.txt" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:VERSION --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:VERSION "dist/Multichain-Tracker.exe" "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $env:VERSION "dist/Multichain-Tracker.exe" "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" --target "${{ github.sha }}" --title "Multichain Tracker $env:VERSION" --generate-notes --repo "${{ github.repository }}"
          }
